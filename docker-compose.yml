services:
  # Backend API Server
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - fleet-network

  # Frontend Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3001/api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      VITE_ENV: production
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - fleet-network


networks:
  fleet-network:
    driver: bridge
